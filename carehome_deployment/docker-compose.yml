# CareHome Clocking - Full Frappe HRMS Deployment
# This deployment includes:
# - Frappe Framework
# - ERPNext (for accounting integration)
# - HRMS (full HR features)
# - CareHome Clocking (custom QR clocking app)

version: "3.8"

x-backend-defaults: &backend_defaults
  image: carehome-clocking:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # ===========================================
  # DATABASE - MariaDB
  # ===========================================
  mariadb:
    image: mariadb:10.11
    container_name: carehome-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-carehome}
      MYSQL_USER: ${DB_USER:-frappe}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./configs/mariadb.cnf:/etc/mysql/conf.d/frappe.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carehome-network

  # ===========================================
  # CACHE & QUEUE - Redis
  # ===========================================
  redis-cache:
    image: redis:7-alpine
    container_name: carehome-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carehome-network

  redis-queue:
    image: redis:7-alpine
    container_name: carehome-redis-queue
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carehome-network

  # ===========================================
  # CONFIGURATOR - Runs once to set up config
  # ===========================================
  configurator:
    image: carehome-clocking:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carehome-configurator
    restart: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host mariadb;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - carehome-network

  # ===========================================
  # BACKEND - Frappe/Gunicorn
  # ===========================================
  backend:
    <<: *backend_defaults
    container_name: carehome-backend
    networks:
      - carehome-network

  # ===========================================
  # WEBSOCKET - Socket.io for realtime
  # ===========================================
  websocket:
    <<: *backend_defaults
    container_name: carehome-websocket
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    networks:
      - carehome-network

  # ===========================================
  # WORKERS - Background job processing
  # ===========================================
  queue-short:
    <<: *backend_defaults
    container_name: carehome-queue-short
    command: bench worker --queue short,default
    networks:
      - carehome-network

  queue-long:
    <<: *backend_defaults
    container_name: carehome-queue-long
    command: bench worker --queue long,default,short
    networks:
      - carehome-network

  # ===========================================
  # SCHEDULER - Cron jobs
  # ===========================================
  scheduler:
    <<: *backend_defaults
    container_name: carehome-scheduler
    command: bench schedule
    networks:
      - carehome-network

  # ===========================================
  # FRONTEND - Nginx reverse proxy
  # ===========================================
  frontend:
    image: carehome-clocking:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carehome-frontend
    restart: unless-stopped
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:-carehome.local}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket
    networks:
      - carehome-network

  # ===========================================
  # NGINX PROXY (Production with SSL)
  # ===========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: carehome-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
    networks:
      - carehome-network
    profiles:
      - production

  # ===========================================
  # CERTBOT - SSL Certificate Management
  # ===========================================
  certbot:
    image: certbot/certbot
    container_name: carehome-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - carehome-network
    profiles:
      - production

# ===========================================
# VOLUMES
# ===========================================
volumes:
  sites:
    name: carehome-sites
  logs:
    name: carehome-logs
  mariadb-data:
    name: carehome-mariadb
  redis-cache-data:
    name: carehome-redis-cache
  redis-queue-data:
    name: carehome-redis-queue
  certbot-www:
    name: carehome-certbot-www
  certbot-conf:
    name: carehome-certbot-conf

# ===========================================
# NETWORKS
# ===========================================
networks:
  carehome-network:
    name: carehome-network
    driver: bridge
