version: '3.8'

services:
  backend:
    image: frappe/bench:latest
    container_name: carehome-backend
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - apps:/home/frappe/frappe-bench/apps
    environment:
      - FRAPPE_SITE_NAME_HEADER=carehome.local
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    networks:
      - carehome-network

  frontend:
    image: frappe/bench:latest
    container_name: carehome-frontend
    restart: unless-stopped
    command: bench serve --port 8000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    ports:
      - "8000:8000"
    depends_on:
      - backend
    networks:
      - carehome-network

  worker-short:
    image: frappe/bench:latest
    container_name: carehome-worker-short
    restart: unless-stopped
    command: bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    depends_on:
      - backend
    networks:
      - carehome-network

  worker-long:
    image: frappe/bench:latest
    container_name: carehome-worker-long
    restart: unless-stopped
    command: bench worker --queue long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    depends_on:
      - backend
    networks:
      - carehome-network

  scheduler:
    image: frappe/bench:latest
    container_name: carehome-scheduler
    restart: unless-stopped
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    depends_on:
      - backend
    networks:
      - carehome-network

  mariadb:
    image: mariadb:10.11
    container_name: carehome-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-frappe}
      MYSQL_DATABASE: ${DB_NAME:-carehome}
      MYSQL_USER: ${DB_USER:-frappe}
      MYSQL_PASSWORD: ${DB_PASSWORD:-frappe}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - carehome-network

  redis-cache:
    image: redis:7-alpine
    container_name: carehome-redis-cache
    restart: unless-stopped
    networks:
      - carehome-network

  redis-queue:
    image: redis:7-alpine
    container_name: carehome-redis-queue
    restart: unless-stopped
    networks:
      - carehome-network

  nginx:
    image: nginx:alpine
    container_name: carehome-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      - frontend
    networks:
      - carehome-network

volumes:
  sites:
  logs:
  apps:
  mariadb-data:

networks:
  carehome-network:
    driver: bridge
