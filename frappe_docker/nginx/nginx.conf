events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # Upstream to Frappe
    upstream frappe-server {
        server frontend:8000 fail_timeout=0;
    }
    
    # Rate limiting for kiosk endpoints
    limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=30r/m;
    
    server {
        listen 80;
        server_name _;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect HTTP to HTTPS in production
        # location / {
        #     return 301 https://$host$request_uri;
        # }
        
        # For development, proxy directly
        location / {
            proxy_pass http://frappe-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
        
        # Static files
        location /assets {
            alias /home/frappe/frappe-bench/sites/assets;
            add_header Cache-Control "public, max-age=31536000";
        }
        
        # Kiosk endpoints with rate limiting
        location /api/method/carehome_clocking.api.validate_token {
            limit_req zone=kiosk_limit burst=5 nodelay;
            proxy_pass http://frappe-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    # HTTPS server (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name carehome.example.com;
    #     
    #     ssl_certificate /etc/letsencrypt/live/carehome.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/carehome.example.com/privkey.pem;
    #     
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     
    #     location / {
    #         proxy_pass http://frappe-server;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
